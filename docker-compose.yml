services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gigfinder
      POSTGRES_PASSWORD: gigfinder_dev
      POSTGRES_DB: gigfinder
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gigfinder']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  postgres_data:
